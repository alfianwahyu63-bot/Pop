plugins {
    id 'com.android.application'
}
android {
    namespace 'id.popstudio.editor'
    compileSdk 35
    defaultConfig {
        applicationId 'id.popstudio.editor'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
